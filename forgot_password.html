<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - glossa</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="navbar">
    <div class="nav-container">
        <a href="index.html" class="brand">glossa</a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="login.html" class="nav-link">Masuk</a>
        </nav>
    </div>
</header>
<main class="container">

<div class="auth-card">
    <h2>Lupa Password</h2>

    <div id="authAlertSuccess" class="alert alert-success" style="display: none;"></div>
    <div id="authAlertError" class="alert alert-error" style="display: none;"></div>

    
    <div id="stepRequest">
        <p class="subtitle">Masukkan email akun Anda untuk menerima 6 digit kode verifikasi.</p>

        <form id="formRequestReset" class="auth-form">
            <div class="form-group">
                <label for="reqEmail">Email Terdaftar</label>
                <input type="email" id="reqEmail" name="email" required autofocus placeholder="nama@email.com">
            </div>

            <button type="submit" id="btnSubmitRequest" class="btn btn-primary">Kirim Kode ke Email</button>
        </form>

        <div class="auth-footer">
            Ingat password Anda? <a href="login.html">Masuk kembali</a>
        </div>
    </div>

    
    <div id="stepVerify" style="display: none;">
        <p class="subtitle">
            Kode verifikasi telah dikirim ke <strong id="displayTargetEmail"></strong>.
        </p>

        <form id="formVerifyReset" class="auth-form">
            <div class="form-group">
                <label for="resetCode">Kode Verifikasi (6 digit angka)</label>
                <input type="text" id="resetCode" name="code" maxlength="6" pattern="[0-9]{6}" placeholder="Contoh: 123456" required>
            </div>

            <div class="form-group">
                <label for="newPassword">Password Baru (min. 6 karakter)</label>
                <div class="password-input-wrapper">
                    <input type="password" id="newPassword" name="password" minlength="6" required placeholder="Password baru">
                    <button type="button" class="btn-toggle-password" aria-label="Lihat password" title="Lihat password">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Konfirmasi Password Baru</label>
                <div class="password-input-wrapper">
                    <input type="password" id="confirmNewPassword" name="confirm_password" minlength="6" required placeholder="Ulangi password baru">
                    <button type="button" class="btn-toggle-password" aria-label="Lihat password" title="Lihat password">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnSubmitVerify" class="btn btn-primary">Simpan Password Baru</button>
        </form>

        <div class="auth-footer">
            Tidak menerima email? <a href="#" id="linkResendCode">Kirim ulang kode</a> &bull; <a href="login.html">Batal</a>
        </div>
    </div>
</div>

</main>

<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    let currentEmail = '';

    const eyeSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const eyeOffSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

    document.querySelectorAll('.btn-toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
            const wrapper = btn.closest('.password-input-wrapper');
            const input = wrapper ? wrapper.querySelector('input') : null;
            if (!input) return;
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = isPassword ? eyeOffSvg : eyeSvg;
        });
    });

    const stepRequest = document.getElementById('stepRequest');
    const stepVerify = document.getElementById('stepVerify');
    const alertSuccess = document.getElementById('authAlertSuccess');
    const alertError = document.getElementById('authAlertError');
    const displayTargetEmail = document.getElementById('displayTargetEmail');

    const formRequest = document.getElementById('formRequestReset');
    const btnSubmitRequest = document.getElementById('btnSubmitRequest');

    formRequest.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertError.style.display = 'none';
        alertSuccess.style.display = 'none';

        currentEmail = document.getElementById('reqEmail').value.trim();
        btnSubmitRequest.disabled = true;
        btnSubmitRequest.textContent = 'Mengirim kode...';

        try {
            const res = await fetch('api/auth.php?action=forgot_request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail })
            });
            const data = await res.json();
            if (data.success) {
                displayTargetEmail.textContent = currentEmail;
                stepRequest.style.display = 'none';
                stepVerify.style.display = 'block';
                alertSuccess.textContent = data.message || 'Kode verifikasi telah dikirim ke email Anda.';
                alertSuccess.style.display = 'block';
                document.getElementById('resetCode').focus();
            } else {
                alertError.textContent = data.error || 'Gagal mengirim kode.';
                alertError.style.display = 'block';
            }
        } catch (err) {
            alertError.textContent = 'Gagal menghubungi server. Silakan coba lagi.';
            alertError.style.display = 'block';
        } finally {
            btnSubmitRequest.disabled = false;
            btnSubmitRequest.textContent = 'Kirim Kode ke Email';
        }
    });

    const formVerify = document.getElementById('formVerifyReset');
    const btnSubmitVerify = document.getElementById('btnSubmitVerify');

    formVerify.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertError.style.display = 'none';
        alertSuccess.style.display = 'none';

        const code = document.getElementById('resetCode').value.trim();
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmNewPassword').value;

        if (password !== confirmPassword) {
            alertError.textContent = 'Konfirmasi password baru tidak cocok.';
            alertError.style.display = 'block';
            return;
        }

        btnSubmitVerify.disabled = true;
        btnSubmitVerify.textContent = 'Menyimpan...';

        try {
            const res = await fetch('api/auth.php?action=forgot_verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail, code, password })
            });
            const data = await res.json();
            if (data.success) {
                alertSuccess.textContent = data.message || 'Password berhasil diperbarui!';
                alertSuccess.style.display = 'block';
                formVerify.reset();
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                alertError.textContent = data.error || 'Verifikasi gagal.';
                alertError.style.display = 'block';
            }
        } catch (err) {
            alertError.textContent = 'Gagal menghubungi server. Silakan coba lagi.';
            alertError.style.display = 'block';
        } finally {
            btnSubmitVerify.disabled = false;
            btnSubmitVerify.textContent = 'Simpan Password Baru';
        }
    });

    document.getElementById('linkResendCode')?.addEventListener('click', (e) => {
        e.preventDefault();
        stepVerify.style.display = 'none';
        stepRequest.style.display = 'block';
        alertSuccess.style.display = 'none';
        alertError.style.display = 'none';
        document.getElementById('reqEmail').focus();
    });
});
</script>
</body>
</html>
